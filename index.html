<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Webカメラ</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#111318;color:#f6f7f9}main{max-width:720px;margin:auto;padding:22px 16px}h1{font-size:22px;margin:0 0 6px}p{color:#b9bec9;font-size:14px;line-height:1.6}.preview{background:#050505;aspect-ratio:4/3;border-radius:14px;overflow:hidden;display:grid;place-items:center;margin:20px 0;position:relative}video{width:100%;height:100%;object-fit:contain}#placeholder{position:absolute;color:#b9bec9;font-size:14px;text-align:center;pointer-events:none}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button,a.download{border:1px solid #404753;border-radius:10px;padding:13px 10px;background:#292f3a;color:white;font-size:15px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}button.primary{background:#396ae5;border-color:#396ae5}button:disabled{opacity:.4;cursor:not-allowed}#status{min-height:44px}#photo{display:none;width:100%;border-radius:12px;margin:14px 0}a.download{display:none;background:#285b49;border-color:#285b49}small{color:#aeb4bf;display:block;margin-top:18px;line-height:1.6}
</style></head>
<body><main><h1>Webカメラ</h1><p>ブラウザからカメラを起動して写真を保存できます。</p>
<div class="preview"><video id="video" autoplay playsinline muted></video><div id="placeholder">「カメラ起動」を押してください</div></div>
<div class="controls"><button class="primary" id="start">カメラ起動</button><button id="switch" disabled>前面 / 背面切替</button><button id="capture" disabled>写真を撮る</button><button id="stop" disabled>カメラ停止</button></div>
<p id="status" role="status" aria-live="polite"></p><canvas id="canvas" hidden></canvas><img id="photo" alt="撮影した写真"><a id="download" class="download">撮影画像を保存</a>
<small>カメラ利用にはブラウザの許可が必要です。通常はHTTPSまたはlocalhostで動作します。画像は端末内で処理され、サーバーへ送信しません。</small></main>
<script>
const video=document.getElementById('video'),startBtn=document.getElementById('start'),switchBtn=document.getElementById('switch'),captureBtn=document.getElementById('capture'),stopBtn=document.getElementById('stop'),statusEl=document.getElementById('status'),placeholder=document.getElementById('placeholder'),canvas=document.getElementById('canvas'),photo=document.getElementById('photo'),download=document.getElementById('download');
let stream=null,facing='environment',imageUrl=null;
function state(active){startBtn.disabled=active;switchBtn.disabled=!active;captureBtn.disabled=!active;stopBtn.disabled=!active;placeholder.style.display=active?'none':'block'}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;state(false)}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){statusEl.textContent='この環境ではカメラを利用できません。HTTPSで開くか、対応ブラウザを使用してください。';return}startBtn.disabled=true;statusEl.textContent='カメラを起動しています…';try{const next=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing}}});stream=next;video.srcObject=next;await video.play();state(true);statusEl.textContent='カメラ起動中'}catch(e){stopCamera();statusEl.textContent=e.name==='NotAllowedError'?'カメラが許可されていません。ブラウザのサイト設定から許可してください。':`カメラを起動できませんでした（${e.name}）。他のアプリで使用中でないか確認してください。`}}
startBtn.addEventListener('click',startCamera);stopBtn.addEventListener('click',()=>{stopCamera();statusEl.textContent='カメラを停止しました'});switchBtn.addEventListener('click',async()=>{stopCamera();facing=facing==='environment'?'user':'environment';await startCamera()});captureBtn.addEventListener('click',()=>{if(!stream||!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.toBlob(blob=>{if(!blob)return;if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(blob);photo.src=imageUrl;photo.style.display='block';download.href=imageUrl;download.download=`camera_${new Date().toISOString().replace(/[:.]/g,'-')}.png`;download.style.display='block';statusEl.textContent='撮影しました。下のボタンから保存できます。'},'image/png')});window.addEventListener('pagehide',()=>{stopCamera();if(imageUrl)URL.revokeObjectURL(imageUrl)});
</script></body></html>
